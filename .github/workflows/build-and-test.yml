# CI — build & test on every push/PR.
name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint + typecheck + unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build (TEST_MODE)
        run: npm run build
        env:
          NEXT_PUBLIC_TEST_MODE: "true"

  web-e2e:
    name: web · Playwright (TEST_MODE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TEST_MODE)
        run: npm run build
        env:
          NEXT_PUBLIC_TEST_MODE: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, TEST_MODE)
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_TEST_MODE: "true"
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  common:
    name: api/common · vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/common
    services:
      # The integration tests create a non-superuser role and database
      # here, so row-level security is enforced as in production.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DB: upstat
        ports:
          - 8123:8123
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/common/go.mod
          cache-dependency-path: api/common/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests (unit + Postgres, ClickHouse, Valkey and Kafka integration)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          CLICKHOUSE_TEST_URL: http://localhost:8123/?database=upstat
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: clickhouse
          REDIS_TEST_ADDR: localhost:6379
          KAFKA_TEST_BROKERS: localhost:9092

      - name: Build
        run: go build ./...

  query:
    name: api/query · vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/query
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_PASSWORD: clickhouse
        ports:
          - 8123:8123
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/query/go.mod
          cache-dependency-path: |
            api/query/go.sum
            api/common/go.sum

      - name: Vet
        run: go vet ./...

      - name: Tests (grammar corpus + ClickHouse integration)
        run: go test ./...
        env:
          CLICKHOUSE_TEST_URL: http://localhost:8123/
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: clickhouse

      - name: Build
        run: go build ./...

  observability:
    name: api/observability · typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/observability
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/observability/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (validate against api/common/contract)
        run: npm test

      - name: Build
        run: npm run build

  analytics:
    name: api/analytics · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/analytics
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/analytics/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Tests (validate against api/common/contract)
        run: pytest

  probe:
    name: functions/probe · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: functions/probe/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check .

      - name: Tests (SSRF guard, causes, multi-step runs)
        run: pytest

  terraform:
    name: deploy/terraform · fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  helm:
    name: deploy/helm · lint + template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Lint
        run: |
          helm lint --strict deploy/helm
          helm lint --strict deploy/helm -f deploy/helm/values-local.yaml

      - name: Template
        run: |
          helm template upstat deploy/helm > /dev/null
          helm template upstat deploy/helm -f deploy/helm/values-local.yaml > /dev/null
