# One chart deploys all services. Images are built from this repo — push to a
# registry and override per environment. Secrets (JWT_SECRET, SESSION_SECRET, GOOGLE_CLIENT_SECRET, tokens) should
# come from Kubernetes Secrets in real deployments, not plain values.
#
# The chart does NOT deploy MongoDB. Point MONGO_URI at a reachable instance
# (managed MongoDB, or e.g. the bitnami/mongodb chart installed as `mongo` in
# the same namespace — the default URI below assumes that service name).
replicaCount: 1

services:
  api-common:
    image: cuesoft/upstat-api-common:latest
    port: 8080
    h2c: true # HTTP/1.1 and h2c on one port
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: Upstat
    # Inject secrets (e.g. JWT_SECRET, SESSION_SECRET, GOOGLE_CLIENT_SECRET) from a Kubernetes Secret instead of env:
    # envFrom:
    #   - secretRef: api-common-secrets

  api-observability:
    image: cuesoft/upstat-api-observability:latest
    port: 8081
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8081"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: Upstat
      API_URL: http://api-common:8080

  web:
    image: cuesoft/upstat-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"

# Optional Ingress (see templates/ingress.yaml). Disabled by default: the chart's
# existing consumers publish through Cloud Run / App Hosting, not an ingress
# controller. Enable per-environment via a values overlay, e.g. values-local.yaml.
ingress:
  enabled: false
