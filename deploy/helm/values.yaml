# One chart deploys all services. Images are built from this repo — push to a
# registry and override per environment. Secrets (JWT_SECRET, tokens) should
# come from Kubernetes Secrets in real deployments, not plain values.
#
# The chart does NOT deploy MongoDB. Point MONGO_URI at a reachable instance
# (managed MongoDB, or e.g. the bitnami/mongodb chart installed as `mongo` in
# the same namespace — the default URI below assumes that service name).
replicaCount: 1

services:
  api-common:
    image: cuesoft/upstat-api-common:latest
    port: 8080
    h2c: true # gRPC + HTTP health multiplexed on one port
    healthPath: /health
    readyPath: /ready
    env:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017/upstat
      MONGO_DB: Upstat
      INSIGHT_SERVICE_GRPC_ADDRESS: api-observability:50051

  api-observability:
    image: cuesoft/upstat-api-observability:latest
    port: 8081
    healthPath: /health
    readyPath: /ready
    extraPorts:
      - name: grpc
        port: 50051
    env:
      PORT: "8081"
      GRPC_PORT: "50051"
      ENABLE_GRPC_SERVER: "true"
      MONGO_URI: mongodb://mongo:27017/upstat
      UPSTAT_GRPC_ADDRESS: api-common:8080

  web:
    image: cuesoft/upstat-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"

  envoy:
    image: envoyproxy/envoy:v1.31.5
    port: 8081
    runAsUser: 101 # envoy user in the official image
    envoyConfig: true # mounts envoy/envoy.yaml via ConfigMap (gRPC-Web -> api-common)
