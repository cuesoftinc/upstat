# Local development stack for upstat.
# Usage: cp .env.example .env  &&  make up
#
# Service wiring:
#   api-common (Go)          HTTP API and /health on :8080, MongoDB, monitor worker
#   api-observability (Py)   FastAPI /health on :8081, ML insights; reads api-common over HTTP
#   Neither hard-depends on the other; both only wait for mongo.
services:
  mongo:
    image: mongo:7
    volumes:
      - upstat-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api-common:
    build: ./api/common
    image: cuesoft/upstat-api-common:latest
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-Upstat}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-0123456789ab}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-0123456789}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-upstat_session}
      OAUTH_STATE_COOKIE: ${OAUTH_STATE_COOKIE:-upstat_oauth_state}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/v1/auth/sso/google/callback}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080/}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api-observability:
    build: ./api/observability
    image: cuesoft/upstat-api-observability:latest
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-Upstat}
      API_URL: http://api-common:8080
      API_TOKEN: ${API_TOKEN:-}
      API_CHECK_LIMIT: ${API_CHECK_LIMIT:-100}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: cuesoft/upstat-web:latest
    build:
      # Repo-root context: web/ plus docs/api/openapi.yaml (the OpenAPI
      # document prebuild embeds for /docs/api); pruned by
      # web/Dockerfile.dockerignore.
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api-common:
        condition: service_healthy
    restart: unless-stopped

volumes:
  upstat-mongo:
