openapi: 3.1.0
info:
  title: Upstat HTTP API
  version: 0.1.0-draft
  description: >-
    Contract for every HTTP route registered by api/common, api/query and
    api/observability. All routes are documented, including /internal/*,
    /health, /ready, /v1/auth/ CORS preflight, OTLP ingests and internal jobs.
    The CORS wrapper also answers OPTIONS on other paths. Auth: Google SSO
    session tokens for user routes; property public keys for ingestion (U-2);
    internal token or ID-token auth for service-to-service routes.
servers:
  - url: https://api-upstat.cuesoft.io
  - url: http://localhost:8080
tags: [{ name: events }, { name: accounts }, { name: monitors }, { name: stats }, { name: alerts }, { name: query }, { name: auth }, { name: incidents }, { name: workspaces }, { name: status }, { name: internal }, { name: ops }]
paths:
  /v1/events:
    post:
      tags: [events]
      summary: "Ingest events (batch ≤100; property key auth; origin-checked; schema-validated)"
      security: [{ propertyKey: [] }]
      responses:
        "202": { description: Per-item results, content: { application/json: { schema: { $ref: "#/components/schemas/EventBatchResult" } } } }
        "400": { description: bad_shape (invalid JSON or batch shape) / bad_request (body read failed), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: key_scope_mismatch / origin_not_allowed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: payload_too_large, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: unsupported_media_type, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: ts_out_of_range / schema rejection, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: rate_limited (600/min sustained), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: unavailable (ingest busy), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
