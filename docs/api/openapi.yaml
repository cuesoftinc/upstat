components:
  securitySchemes:
    session: { type: http, scheme: bearer, bearerFormat: "Session JWT issued by POST /v1/auth/sso/exchange (also sent as an HttpOnly cookie)" }
    propertyKey: { type: http, scheme: bearer, bearerFormat: "write-only property public key (pk_..., 24h rotation grace); OTLP ingests also accept the Upstat-Ingest-Key header" }
    internalToken: { type: apiKey, in: header, name: X-Internal-Token, description: "Shared INTERNAL_TOKEN for service-to-service query routes" }
    internalIdToken: { type: http, scheme: bearer, bearerFormat: "Google ID token whose email is in the query service's INTERNAL_INVOKERS" }
    schedulerToken: { type: http, scheme: bearer, bearerFormat: "Google ID token for the configured scheduler invoker" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    WidgetId: { name: widgetId, in: path, required: true, schema: { type: string } }
    Slug: { name: slug, in: path, required: true, schema: { type: string } }
