openapi: 3.1.0
info:
  title: Upstat HTTP API
  version: 0.1.0-draft
  description: >-
    Contract for the HTTP surfaces (events, stats, query, alerts-v2, monitors,
    OTLP omitted; standard protocol). Auth: Google SSO session tokens for user
    routes; property public keys for ingestion (U-2).
servers:
  - url: https://api-upstat.cuesoft.io
  - url: http://localhost:8080
tags: [{ name: events }, { name: monitors }, { name: stats }, { name: alerts }, { name: query }, { name: auth }]
paths:
  /v1/events:
    post:
      tags: [events]
      summary: "Ingest events (batch ≤100; property key auth; origin-checked; schema-validated)"
      security: [{ propertyKey: [] }]
      responses:
        "202": { description: Per-item results, content: { application/json: { schema: { $ref: "#/components/schemas/EventBatchResult" } } } }
        "422": { description: ts_out_of_range / schema rejection }
        "429": { description: rate_limited (600/min sustained) }
  /v1/monitors:
    get:
      tags: [monitors]
      summary: List the signed-in user's monitors
      security: [{ session: [] }]
      responses:
        "200": { description: Monitors owned by the caller, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Monitor" } } } } }
        "401": { description: Unauthenticated }
    post:
      tags: [monitors]
      summary: Create a monitor (active, status unknown, 60 s interval, 10 s timeout, failure threshold 3)
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorCreate" } } } }
      responses:
        "201": { description: Created monitor, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        "400": { description: "bad_shape (malformed JSON body or body over 64 KiB)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthenticated }
        "422": { description: "bad_shape (name, type and target are required)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/monitors/{id}:
    get:
      tags: [monitors]
      summary: Get one monitor (owner only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      security: [{ session: [] }]
      responses:
        "200": { description: Monitor, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        "401": { description: Unauthenticated }
        "404": { description: not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [monitors]
      summary: Update name, target or type; omitted fields keep their value (owner only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorUpdate" } } } }
      responses:
        "200": { description: Updated monitor, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        "400": { description: bad_shape (malformed JSON body or body over 64 KiB), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Unauthenticated }
        "404": { description: not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: bad_shape (name, type and target cannot be empty), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [monitors]
      summary: Delete a monitor (owner only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }
        "401": { description: Unauthenticated }
        "404": { description: not_found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/monitors/{id}/checks:
    get:
      tags: [monitors]
      summary: Recent checks and 90-day uptime for a monitor (public)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 }, description: "Larger values are capped at 500" }
      responses:
        "200": { description: Check history, content: { application/json: { schema: { $ref: "#/components/schemas/MonitorHistory" } } } }
        "400": { description: "bad_shape (limit must be a positive integer)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/status/{ownerId}:
    get:
      tags: [monitors]
      summary: Public status page data for one owner's monitors (checks counted over the last 24 hours)
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Status page, content: { application/json: { schema: { $ref: "#/components/schemas/StatusPage" } } } }
  /v1/stats:
    get: { tags: [stats], summary: "Rollup series (uniques_additive: false in metadata)", security: [{ session: [] }], responses: { "200": { description: Series } } }
  /v1/query:
    post: { tags: [query], summary: Shared-grammar query (query-grammar.md), security: [{ session: [] }], responses: { "200": { description: Results }, "400": { description: "invalid_query {position, hint}" } } }
  /v1/channels:
    post: { tags: [alerts], summary: Create alert channel (webhook/email), security: [{ session: [] }], responses: { "201": { description: Channel (unverified) } } }
  /v1/channels/{id}/verify:
    post: { tags: [alerts], summary: Verify channel, security: [{ session: [] }], responses: { "200": { description: Verified } } }
  /v1/monitors/{id}/rules:
    put: { tags: [alerts], summary: Set alert rules (on/cooldown/channels), security: [{ session: [] }], responses: { "200": { description: Rules } } }
  /v1/channels/{id}:
    delete: { tags: [alerts], parameters: [{ $ref: "#/components/parameters/Id" }], summary: Delete channel (detaches from rules), security: [{ session: [] }], responses: { "204": { description: Deleted } } }
  /v1/channels-list:
    get: { tags: [alerts], summary: List channels (owner), security: [{ session: [] }], responses: { "200": { description: Channels } } }
  /v1/monitors/{id}/rules-get:
    get: { tags: [alerts], parameters: [{ $ref: "#/components/parameters/Id" }], summary: Get rules, security: [{ session: [] }], responses: { "200": { description: Rules } } }
  /v1/auth/sso/google:
    get:
      tags: [auth]
      summary: "Start Google sign-in (cv = PKCE S256 challenge); redirects to Google with a state cookie"
      parameters: [{ name: cv, in: query, required: false, schema: { type: string, minLength: 43, maxLength: 43 } }]
      responses:
        "307": { description: Redirect to Google }
        "429": { description: rate_limited }
        "503": { description: sso_config_invalid }
  /v1/auth/sso/google/callback:
    get:
      tags: [auth]
      summary: "Google redirect target; verifies state, issues a one-time handoff, redirects to the web app /auth/callback?handoff="
      responses:
        "302": { description: Redirect to the web app (errors go to /signin?error=) }
  /v1/auth/sso/exchange:
    post:
      tags: [auth]
      summary: "Trade the handoff code and PKCE verifier for a session token; also sets the session cookie"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [handoff, verifier], properties: { handoff: { type: string }, verifier: { type: string } } } } } }
      responses:
        "200": { description: "{ data: { access_token, token_type, expires_in } }" }
        "401": { description: handoff_invalid }
  /v1/auth/me:
    get: { tags: [auth], summary: Current session identity, security: [{ session: [] }], responses: { "200": { description: "{ data: { id, email, name } }" }, "401": { description: Unauthenticated } } }
  /v1/auth/logout:
    post: { tags: [auth], summary: Clear the session and handoff cookies, responses: { "204": { description: Cleared }, "403": { description: csrf_rejected } } }

components:
  securitySchemes:
    session: { type: http, scheme: bearer, bearerFormat: "Session JWT issued by POST /v1/auth/sso/exchange (also sent as an HttpOnly cookie)" }
    propertyKey: { type: http, scheme: bearer, bearerFormat: "write-only property public key (pk_..., 24h rotation grace)" }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: snake_case stable (engineering.md §1) }
            message: { type: string }
            details: { type: array, items: { type: string } }
    MonitorCreate:
      type: object
      required: [name, type, target]
      properties:
        name: { type: string }
        type: { type: string }
        target: { type: string }
    MonitorUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        target: { type: string }
    Monitor:
      type: object
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        target: { type: string }
        type: { type: string }
        active: { type: boolean }
        status: { type: string }
        muted: { type: boolean }
        interval_seconds: { type: integer }
        timeout_seconds: { type: integer }
        failure_threshold: { type: integer }
        consecutive_failures: { type: integer }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_response_time_ms: { type: [integer, "null"] }
        last_status_code: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Check:
      type: object
      properties:
        id: { type: string }
        monitor_id: { type: string }
        up: { type: boolean }
        status_code: { type: integer }
        response_time_ms: { type: integer }
        checked_at: { type: string, format: date-time }
    MonitorHistory:
      type: object
      properties:
        monitor_id: { type: string }
        days: { type: array, items: {} }
        recent_checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        uptime_90d_pct: { type: [number, "null"], description: "null when the monitor has no checks in the last 90 days" }
    Incident:
      type: object
      properties:
        id: { type: string }
        monitor_id: { type: string }
        title: { type: string }
        failure_reason: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        duration_seconds: { type: integer }
    StatusPage:
      type: object
      properties:
        monitors: { type: array, items: { $ref: "#/components/schemas/Monitor" } }
        active_incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        historical_incidents: { type: array, items: { $ref: "#/components/schemas/Incident" } }
        uptime_percentage: { type: number }
        total_checks: { type: integer }
        successful_checks: { type: integer }
    EventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 100
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, description: registered event name (api.md §3.4) }
              ts: { type: string, format: date-time, description: "within [now-48h, now+5min]" }
              dims: { type: object, description: only dims registered for this event }
    EventBatchResult:
      type: object
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        rejections: { type: array, items: { type: object, properties: { index: { type: integer }, code: { enum: [unknown_event, unknown_dim, ts_out_of_range, bad_shape] } } } }
    StatsResponse:
      type: object
      properties:
        series: { type: array, items: { type: object, properties: { bucket: { type: string, format: date-time }, count: { type: integer }, uniques: { type: integer } } } }
        totals: { type: object, properties: { count: { type: integer }, uniques_daily_avg: { type: number } } }
        uniques_additive: { type: boolean, description: always false (analytics-math.md §4) }
    AlertRule:
      type: object
      properties:
        "on": { enum: [down, recovered, nodata, all] }
        channel_ids: { type: array, items: { type: string } }
        cooldown_minutes: { type: integer, default: 30 }
        renotify_minutes: { type: integer, default: 0 }
