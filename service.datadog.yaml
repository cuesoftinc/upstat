apiVersion: v3
kind: system
metadata:
  name: upstat
  displayName: upstat
  description: Upstat platform
  owner: cuesoft
  tags:
    - app:upstat
    - component:system
  contacts:
    - type: email
      contact: cuelabs@cuesoft.io
  additionalOwners:
    - name: platform
      type: SRE
  links:
    - name: Repository
      type: repo
      provider: github
      url: https://github.com/cuesoftinc/upstat
    - name: Website
      type: other
      url: https://upstat.cuesoft.io
spec:
  lifecycle: production
  tier: "1"
  components:
    - service:upstat-website
    - service:upstat-api-common
    - service:upstat-api-observability
    - service:upstat-api-observability-grpc
    - service:upstat-api-query
    - service:upstat-api-analytics
    - service:upstat-otel-collector
    - service:upstat-probe-us-central1
    - service:upstat-probe-us-east4
    - datastore:upstat-postgres
    - datastore:upstat-clickhouse
    - datastore:upstat-redis
    - datastore:upstat-storage
    - datastore:cuelabs-kafka
